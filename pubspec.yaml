publish_to: 'none'
version: 1.0.6+6

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  ars_login:
    git:
      url: https://github.com/okpojung/ars_auth.git
      ref: feature/ars2fa-v1  # ars_login 2.x (ars2fa). SDK PR #2가 main에 합쳐지면 main으로 바꾸세요.
  
  flutter_inappwebview: ^6.0.0
  shared_preferences: ^2.2.2
  flutter_riverpod: ^2.4.9
  package_info_plus: ^8.1.2
  device_info_plus: ^10.1.2
  mobile_scanner: ^7.5.0
  http: ^1.6.0
  url_launcher: ^6.3.3
  permission_handler: ^12.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  rename: ^3.1.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
